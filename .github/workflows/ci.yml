name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded push has nothing useful left to prove.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # Pinned to commit SHAs: a moved tag would otherwise run unreviewed code
      # with read access to this repository.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Release validation requires the annotated tag named by CHANGELOG.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # build.py and release_test.py run under the py launcher. Pillow is not
      # installed: nothing in CI regenerates icons, and build.py is stdlib-only.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      # Playwright is the only dependency and never ships; a dev-only advisory
      # must not block unrelated changes.
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run check
      # Type-checks the untyped source. It emits nothing and adds no runtime
      # dependency; TypeScript is dev-only and never enters the package.
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:release
      - run: npm run build
      - run: npx playwright install chromium
      # The headless offline lane runs the full deterministic browser workflow
      # against the shipped ZIP: refresh, themes/contrast, credentials,
      # diagnostics, backup/restore, destructive recovery and notifications.
      # API traffic is fixture-backed and every other external route is aborted.
      - run: node tests/smoke.mjs --zip --offline

  firefox-advisory:
    name: Firefox extension smoke (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Firefox port is not shipping yet. web-ext still proves that the
      # disposable compatibility manifest and shared extension page load.
      - run: npm run test:firefox

  reproducible-build:
    name: Reproducible build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py
      # Compare only the published checksum. The installable ZIP is never
      # uploaded as a CI artifact.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-sha-${{ runner.os }}
          path: dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 1

  compare-builds:
    name: Compare Windows and Linux release bytes
    needs: reproducible-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-sha-*
          path: checksums
      - name: Require one cross-OS ZIP checksum
        shell: bash
        run: |
          mapfile -t hashes < <(awk '{print $1}' checksums/*/*.zip.sha256 | sort -u)
          if [[ ${#hashes[@]} -ne 1 ]]; then
            echo "Windows and Linux produced different ZIP checksums" >&2
            find checksums -type f -name '*.zip.sha256' -print -exec cat {} \;
            exit 1
          fi
          echo "Cross-OS ZIP sha256: ${hashes[0]}"
