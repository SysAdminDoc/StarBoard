name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded push has nothing useful left to prove.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # Pinned to commit SHAs: a moved tag would otherwise run unreviewed code
      # with read access to this repository.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # build.py and release_test.py run under the py launcher. Pillow is not
      # installed: nothing in CI regenerates icons, and build.py is stdlib-only.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      # Playwright is the only dependency and never ships; a dev-only advisory
      # must not block unrelated changes.
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run check
      - run: npm run test:unit
      - run: npm run test:release
      - run: npm run build
      - run: npx playwright install chromium
      # The offline lane drives a full refresh, generation commit, delta,
      # history, badge and export cycle against fixtures injected into the
      # service worker, with every external route aborted.
      - run: node tests/smoke.mjs --zip --offline
