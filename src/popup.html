<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>StarBoard</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand" aria-label="StarBoard">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <path d="M16 1.5 19.1 12.9 30.5 16l-11.4 3.1L16 30.5l-3.1-11.4L1.5 16l11.4-3.1L16 1.5Z" />
            <circle cx="25.5" cy="6.5" r="1.5" />
          </svg>
        </span>
        <span class="brand-copy">
          <b>StarBoard</b>
          <small>Portfolio signal</small>
        </span>
      </div>
      <div class="identity">
        <img id="avatar" class="avatar" alt="" width="30" height="30" />
        <span class="account-copy">
          <a id="login" class="login" href="#" target="_blank" rel="noreferrer">Loading…</a>
          <span id="subline" class="subline">Connecting</span>
        </span>
      </div>
      <button
        id="refresh"
        class="icon-btn"
        title="Refresh now"
        aria-label="Refresh now"
        disabled
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path
            d="M8 3a5 5 0 1 0 4.546 2.914.75.75 0 0 1 1.362-.628A6.5 6.5 0 1 1 8 1.5V.31a.25.25 0 0 1 .4-.2l2.26 1.69a.25.25 0 0 1 0 .4L8.4 3.89a.25.25 0 0 1-.4-.2Z"
          />
        </svg>
      </button>
      <button id="settings" class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path
            d="M8 10.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5Zm0-1.5a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"
          />
          <path
            d="M6.8.5a.75.75 0 0 0-.74.63l-.2 1.2a5.6 5.6 0 0 0-1.05.6l-1.14-.43a.75.75 0 0 0-.9.33L1.6 4.72a.75.75 0 0 0 .16.95l.94.78a5.7 5.7 0 0 0 0 1.1l-.94.78a.75.75 0 0 0-.16.95l1.17 1.9c.18.3.55.43.9.33l1.14-.44c.33.25.68.45 1.05.6l.2 1.2c.06.36.37.63.74.63h2.4c.37 0 .68-.27.74-.63l.2-1.2c.37-.15.72-.35 1.05-.6l1.14.44c.35.1.72-.03.9-.33l1.17-1.9a.75.75 0 0 0-.16-.95l-.94-.78a5.7 5.7 0 0 0 0-1.1l.94-.78a.75.75 0 0 0 .16-.95l-1.17-1.9a.75.75 0 0 0-.9-.32l-1.14.43a5.6 5.6 0 0 0-1.05-.6l-.2-1.2A.75.75 0 0 0 9.2.5Zm.64 1.5h1.12l.16.98a.75.75 0 0 0 .52.6c.46.15.88.4 1.24.72a.75.75 0 0 0 .77.13l.93-.35.56.9-.77.64a.75.75 0 0 0-.26.73 4.2 4.2 0 0 1 0 1.48.75.75 0 0 0 .26.73l.77.64-.56.9-.93-.35a.75.75 0 0 0-.77.13c-.36.32-.78.57-1.24.72a.75.75 0 0 0-.52.6l-.16.98H7.44l-.16-.98a.75.75 0 0 0-.52-.6 4.1 4.1 0 0 1-1.24-.72.75.75 0 0 0-.77-.13l-.93.35-.56-.9.77-.64a.75.75 0 0 0 .26-.73 4.2 4.2 0 0 1 0-1.48.75.75 0 0 0-.26-.73l-.77-.64.56-.9.93.35a.75.75 0 0 0 .77-.13c.36-.32.78-.57 1.24-.72a.75.75 0 0 0 .52-.6Z"
          />
        </svg>
      </button>
    </header>

    <section id="totals" class="totals" hidden>
      <div class="orbit" aria-hidden="true"></div>
      <span id="confidence" class="confidence-badge"></span>
      <div class="total total-hero">
        <span class="metric-icon star-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16">
            <path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z" />
          </svg>
        </span>
        <span class="total-row">
          <b id="total-stars">0</b>
          <span id="total-stars-delta" class="delta"></span>
        </span>
        <span id="total-stars-label" class="total-label">Total stars</span>
      </div>
      <div class="secondary-totals">
        <div id="total-forks-wrap" class="total">
          <span class="total-label">Forks</span>
          <span class="total-row">
            <b id="total-forks">0</b>
            <span id="total-forks-delta" class="delta"></span>
          </span>
        </div>
        <div class="total">
          <span id="total-repos-label" class="total-label">Repos</span>
          <span class="total-row"><b id="total-repos">0</b></span>
        </div>
      </div>
      <button
        id="rebase"
        class="ghost-btn"
        title="Start measuring changes from right now"
        disabled
      >
        <span id="since">since —</span>
      </button>
    </section>

    <div class="toolbar">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true">
          <path
            d="M10.68 11.74a6 6 0 1 1 1.06-1.06l3.04 3.04a.75.75 0 1 1-1.06 1.06ZM11.5 7a4.5 4.5 0 1 0-9 0 4.5 4.5 0 0 0 9 0Z"
          />
        </svg>
        <input
          id="search"
          type="search"
          placeholder="Filter repositories…"
          aria-label="Filter repositories"
          autocomplete="off"
          spellcheck="false"
          disabled
        />
      </div>
      <select id="sort" title="Sort order" aria-label="Sort repositories" disabled>
        <option value="stars">Stars</option>
        <option value="starsDelta">Momentum · stars</option>
        <option value="forks">Forks</option>
        <option value="forksDelta">Momentum · forks</option>
        <option value="updated">Recently pushed</option>
        <option value="name">Name A–Z</option>
      </select>
    </div>

    <div class="viewbar">
      <label class="view-select-wrap">
        <span>View</span>
        <select id="viewSelect" aria-label="Saved portfolio view" disabled>
          <option value="">Custom view</option>
        </select>
      </label>
      <button id="saveView" class="compact-btn" type="button" disabled>Save</button>
      <button id="renameView" class="compact-btn" type="button" disabled>Rename</button>
      <button id="deleteView" class="compact-btn danger-compact" type="button" disabled>
        Delete
      </button>
    </div>

    <form id="viewEditor" class="view-editor" hidden>
      <label for="viewName">View name</label>
      <input id="viewName" maxlength="40" autocomplete="off" required />
      <button id="confirmView" class="compact-btn" type="submit">Save view</button>
      <button id="cancelView" class="compact-btn" type="button">Cancel</button>
    </form>

    <div class="chips">
      <button
        id="toggleFilters"
        class="filter-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="filterPanel"
        disabled
      >
        Filters <span id="filterCount" hidden>0</span>
      </button>
      <label class="trend-control">
        <span>Trend</span>
        <select id="trendRange" aria-label="Comparison range" disabled>
          <option value="baseline">Baseline</option>
          <option value="7">7 days</option>
          <option value="30">30 days</option>
          <option value="90">90 days</option>
        </select>
      </label>
      <span class="spacer"></span>
      <span id="count" class="count"></span>
    </div>

    <section id="filterPanel" class="filter-panel" aria-label="Repository filters" hidden>
      <label>
        <span>Language</span>
        <select id="filterLanguage" disabled>
          <option value="all">All languages</option>
        </select>
      </label>
      <label>
        <span>Visibility</span>
        <select id="filterVisibility" disabled>
          <option value="all">Public + private</option>
          <option value="public">Public only</option>
          <option value="private">Private only</option>
        </select>
      </label>
      <label>
        <span>Repository type</span>
        <select id="filterForks" disabled>
          <option value="sources">Originals only</option>
          <option value="all">Originals + forks</option>
          <option value="forks">Forks only</option>
        </select>
      </label>
      <label>
        <span>Archive state</span>
        <select id="filterArchived" disabled>
          <option value="all">Active + archived</option>
          <option value="active">Active only</option>
          <option value="archived">Archived only</option>
        </select>
      </label>
      <label>
        <span>Count precision</span>
        <select id="filterPrecision" disabled>
          <option value="all">Exact + approximate</option>
          <option value="exact">Exact only</option>
          <option value="approximate">Approximate only</option>
        </select>
      </label>
      <label>
        <span>Lifecycle</span>
        <select id="filterLifecycle" disabled>
          <option value="all">Any lifecycle</option>
          <option value="changed">New or renamed</option>
          <option value="added">New only</option>
          <option value="renamed">Renamed only</option>
          <option value="unchanged">No current change</option>
        </select>
      </label>
      <label>
        <span>Last push</span>
        <select id="filterActivity" disabled>
          <option value="all">Any time</option>
          <option value="30">Within 30 days</option>
          <option value="90">Within 90 days</option>
          <option value="365">Within one year</option>
          <option value="stale">More than one year</option>
          <option value="unknown">Unknown</option>
        </select>
      </label>
      <button id="resetFilters" class="compact-btn reset-filters" type="button" disabled>
        Reset filters
      </button>
    </section>

    <div id="banner" class="banner" hidden></div>

    <section id="lifecycle" class="lifecycle" aria-labelledby="lifecycle-title" hidden>
      <div class="lifecycle-heading">
        <b id="lifecycle-title">Repository changes</b>
        <button id="ack-lifecycle" type="button">Acknowledge</button>
      </div>
      <ul id="lifecycle-list"></ul>
    </section>

    <main id="list" class="list" aria-busy="true"></main>

    <footer id="footer" class="footer">
      <span id="updated">—</span>
      <button id="undo" class="footer-action" type="button" hidden>Undo last action</button>
      <span class="spacer"></span>
      <span id="rate" class="rate"></span>
    </footer>
    <p id="live-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
