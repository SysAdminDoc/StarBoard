<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>StarBoard — Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="page">
      <header>
        <h1>StarBoard</h1>
        <span class="version" id="version"></span>
      </header>

      <section class="card">
        <h2>Account</h2>

        <label class="field">
          <span class="label">GitHub username</span>
          <input id="username" type="text" placeholder="octocat" spellcheck="false" autocomplete="off" />
          <span class="hint">The account whose repos you want to track.</span>
        </label>

        <label class="field">
          <span class="label">Where to read from</span>
          <select id="dataSource">
            <option value="api">GitHub API — recommended</option>
            <option value="web">GitHub website — no token needed</option>
          </select>
          <span class="hint" id="sourceHint"></span>
        </label>

        <label class="field" id="tokenField">
          <span class="label">Personal access token <span class="opt">optional</span></span>
          <input id="token" type="password" placeholder="ghp_… or github_pat_…" spellcheck="false" autocomplete="off" />
          <span class="hint">
            Without a token GitHub allows 60 requests per hour and only shows public repos. A
            token with the <code>public_repo</code> scope (or a fine-grained token with read-only
            <em>Metadata</em>) raises that to 5,000/hour; add <code>repo</code> to include private
            repos. Stored locally in this browser profile only, never transmitted anywhere except
            api.github.com.
            <a href="https://github.com/settings/tokens" target="_blank" rel="noreferrer">Create one →</a>
          </span>
        </label>

        <div class="actions">
          <button id="save" class="primary-btn">Save &amp; refresh</button>
          <button id="test" class="secondary-btn">Test connection</button>
          <span id="status" class="status"></span>
        </div>
      </section>

      <section class="card">
        <h2>Refresh</h2>

        <label class="field row">
          <span class="label">Auto-refresh every</span>
          <select id="refreshMinutes">
            <option value="0">Never (manual only)</option>
            <option value="15">15 minutes</option>
            <option value="30">30 minutes</option>
            <option value="60">1 hour</option>
            <option value="180">3 hours</option>
            <option value="360">6 hours</option>
            <option value="720">12 hours</option>
            <option value="1440">24 hours</option>
          </select>
        </label>

        <label class="field row">
          <span class="label">Reset the change baseline every</span>
          <select id="baselineHours">
            <option value="0">Never (manual only)</option>
            <option value="6">6 hours</option>
            <option value="24">24 hours</option>
            <option value="168">7 days</option>
            <option value="720">30 days</option>
          </select>
        </label>
        <p class="note">
          The baseline is the snapshot that <b>+N</b> star and fork changes are measured against.
          Reset it any time from the popup by clicking the “Δ since …” button.
        </p>
      </section>

      <section class="card">
        <h2>Appearance</h2>
        <label class="field row">
          <span class="label">Theme</span>
          <select id="theme">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
            <option value="auto">Match system</option>
          </select>
        </label>
        <label class="field row">
          <span class="label">Show on the extension icon</span>
          <select id="badgeMode">
            <option value="stars">Total stars</option>
            <option value="delta">Stars gained since baseline</option>
            <option value="off">Nothing</option>
          </select>
        </label>
      </section>

      <section class="card danger">
        <h2>Data</h2>
        <p class="note">
          Everything StarBoard stores lives in this browser profile:
          <span id="storageInfo">—</span>
        </p>
        <div class="actions">
          <button id="clear" class="secondary-btn">Clear cached data</button>
        </div>
      </section>

      <footer>
        <a href="https://github.com/SysAdminDoc/StarBoard" target="_blank" rel="noreferrer">StarBoard on GitHub</a>
        · MIT licensed
      </footer>
    </div>
    <script type="module" src="options.js"></script>
  </body>
</html>
